<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COS 101 CBT - Fresh Set 2</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:15px;color:#172033}
.container{max-width:800px;margin:auto;background:white;padding:22px;border-radius:14px;box-shadow:0 4px 15px #0001}
h1{text-align:center;color:#173b70;font-size:25px}
.notice{text-align:center;color:#526176}
.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#eaf2ff;padding:12px;border-radius:9px;font-weight:bold}
#progress{height:8px;background:#ddd;border-radius:8px;margin:14px 0;overflow:hidden}
#bar{height:100%;width:0;background:#2563eb}
#question{font-size:19px;font-weight:bold;line-height:1.5;margin:20px 0}
.option{display:block;width:100%;text-align:left;padding:13px;margin:9px 0;border:2px solid #dbe2ea;border-radius:8px;background:white;font-size:16px;cursor:pointer}
.option:hover{background:#eff6ff}
.option.selected{border-color:#2563eb;background:#dbeafe}
.nav{display:flex;gap:10px;margin-top:20px}
button.action{padding:12px 16px;border:0;border-radius:8px;background:#173b70;color:white;font-size:15px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
#next{margin-left:auto}
#result{display:none}
.review{padding:14px;margin:12px 0;background:#f8fafc;border-left:5px solid #2563eb;border-radius:7px}
.correct{color:#087443;font-weight:bold}
.wrong{color:#b91c1c;font-weight:bold}
.small{color:#64748b;font-size:14px}
</style>
</head>
<body>
<div class="container">
<h1>COS 101 CBT — Fresh Set 2</h1>
<p class="notice">Modules 2 & 3 | 30 Questions | 15 Minutes</p>

<div class="stats" id="stats">
<span id="timer">Time: 15:00</span>
<span id="counter">Question 1 of 30</span>
<span id="answered">Answered: 0/30</span>
</div>
<div id="progress"><div id="bar"></div></div>

<div id="quiz">
<div id="question"></div>
<div id="options"></div>
<div class="nav">
<button class="action" id="prev" onclick="move(-1)">Previous</button>
<button class="action" id="next" onclick="move(1)">Next</button>
</div>
<p class="small">Choose one answer per question. Your score and explanations will appear only after you submit or the timer ends.</p>
<button class="action" onclick="submitQuiz(false)" style="width:100%;background:#15803d;margin-top:12px">Submit All Answers</button>
</div>

<div id="result">
<h2 id="score"></h2>
<p id="comment"></p>
<h2>Answer Review and Explanations</h2>
<div id="review"></div>
<button class="action" onclick="restart()">Try Again</button>
</div>
</div>

<script>
const questions = [
{
q:"A student enters 15 and 25 into a computer. The computer adds them and displays 40. Which option correctly identifies the result 40?",
o:["Input","Raw data","Output","Procedure"],
a:2,
e:"The displayed answer is output because it is the result produced after processing."
},
{
q:"Which situation best demonstrates the relationship between hardware and software?",
o:["A keyboard operates without any instructions","A program gives instructions that the processor executes using physical components","Data replaces all physical components","Peopleware makes hardware unnecessary"],
a:1,
e:"Software provides instructions, while hardware provides the physical components that execute them."
},
{
q:"A computer produces the same result whenever it receives the same correct data and instructions. This demonstrates:",
o:["Consistency","Versatility","Storage","Communication"],
a:0,
e:"Consistency means producing the same results when the same input and processes are used."
},
{
q:"Which CPU component is primarily responsible for arithmetic calculations and logical comparisons?",
o:["Control Unit","ALU","Monitor","SSD"],
a:1,
e:"The Arithmetic and Logic Unit (ALU) performs arithmetic and logical operations."
},
{
q:"A computer user wants to preserve files even after switching off the computer. Which is the most suitable option?",
o:["Registers","RAM alone","SSD","Control Unit"],
a:2,
e:"An SSD is a storage device used to retain data for later use."
},
{
q:"Which statement about the Control Unit is most accurate?",
o:["It coordinates and directs computer operations","It is the main device for printing documents","It permanently stores every file","It is responsible only for arithmetic"],
a:0,
e:"The Control Unit coordinates and directs the activities of the computer."
},
{
q:"A worker follows an approved sequence for entering and saving records. In the five-component model, the sequence is best described as:",
o:["Hardware","Data","Procedures","Peopleware"],
a:2,
e:"Procedures are the rules or steps followed when operating a computer system."
},
{
q:"Which option contains only examples of input devices?",
o:["Monitor, printer, speakers","Keyboard, mouse, scanner","SSD, RAM, ROM","CPU, ALU, Control Unit"],
a:1,
e:"A keyboard, mouse, and scanner can all be used to enter data or instructions."
},
{
q:"A computer is used to prepare documents, analyse figures, and play audio. Which characteristic does this best demonstrate?",
o:["Diligence","Versatility","Privacy violation","Consistency"],
a:1,
e:"Versatility is the ability to perform different kinds of tasks."
},
{
q:"Which statement about computer accuracy is the most reasonable?",
o:["A computer always corrects incorrect data automatically","A computer can produce incorrect results when input or instructions are incorrect","Accuracy means a computer never needs instructions","Accuracy means the computer can store unlimited data"],
a:1,
e:"Correct results depend on correct input and working instructions."
},
{
q:"Which of the following is NOT one of the five components described in the basic computer-system model?",
o:["Hardware","Software","Peopleware","Electricity bill"],
a:3,
e:"The five components are hardware, software, data, peopleware, and procedures."
},
{
q:"Which sequence best represents the basic information processing cycle?",
o:["Output → Input → Storage → Processing","Input → Processing → Output → Storage","Storage → Output → Input → Processing","Processing → Storage → Input → Output"],
a:1,
e:"The common sequence is input, processing, output, and storage."
},
{
q:"A computer stores data for use later. Which computer-system function is being demonstrated?",
o:["Storage","Input only","Output only","Communication only"],
a:0,
e:"Storage keeps data or information for future use."
},
{
q:"Which option correctly matches a component with its function?",
o:["ALU — coordinates all activities only","Control Unit — performs all arithmetic only","Input unit — accepts data and instructions","Output unit — enters raw data"],
a:2,
e:"The input unit accepts data and instructions from users or other devices."
},
{
q:"A person uses a computer to communicate with another person using a network. Which advantage is being demonstrated?",
o:["Communication","Health risk","Privacy violation","Environmental waste"],
a:0,
e:"Computers enable users and devices to exchange information."
},
{
q:"Which of these is the clearest example of automation?",
o:["A person manually calculates every sum","A computer performs an instructed task automatically","A user switches off a monitor","A worker writes instructions on paper"],
a:1,
e:"Automation means a computer can carry out instructed operations automatically."
},
{
q:"Which statement best distinguishes data from information?",
o:["Data is always more meaningful than information","Data consists of raw facts; information is data processed into a meaningful form","Data and information can never be related","Information is always entered before data"],
a:1,
e:"Data refers to raw facts, while information is meaningful output obtained by processing data."
},
{
q:"Which of these is most clearly an output device?",
o:["Mouse","Keyboard","Monitor","Scanner"],
a:2,
e:"A monitor presents visual results from the computer."
},
{
q:"A computer keeps performing repetitive calculations without becoming tired like a human. This demonstrates:",
o:["Diligence","Privacy","Public safety","Environmental impact"],
a:0,
e:"Diligence refers to the computer's ability to repeat tasks without tiring like a person."
},
{
q:"A school stores students' private records on a computer but fails to protect them properly. Which disadvantage is most directly illustrated?",
o:["Speed","Violation of privacy","Versatility","Consistency"],
a:1,
e:"Poor protection of personal or confidential records can lead to privacy violations."
},
{
q:"Which situation best illustrates a public-safety concern associated with computer use?",
o:["A computer performs calculations quickly","A person shares personal information publicly and becomes vulnerable to dangerous strangers","A computer stores a school timetable","A user uses software to prepare notes"],
a:1,
e:"The lecture identifies publicly sharing personal information as a possible public-safety risk."
},
{
q:"A company introduces computers and some employees' previous skills are no longer needed for their former tasks. Which disadvantage is most relevant?",
o:["Impact on the labour force","Storage","Consistency","Communication"],
a:0,
e:"Computers can replace some workers' skills, although they can also improve productivity and create jobs."
},
{
q:"Which action best supports the prevention of health problems associated with prolonged computer use?",
o:["Maintaining poor posture","Avoiding all breaks","Using proper posture and taking appropriately spaced breaks","Increasing screen time continuously"],
a:2,
e:"The lecture recommends proper workplace design, good posture, and appropriately spaced breaks."
},
{
q:"A person feels distressed when unable to use their computer or mobile device. Which term from the lecture is most relevant?",
o:["Technology overload","Storage","Automation","Versatility"],
a:0,
e:"Technology overload involves distress when deprived of computers and mobile devices."
},
{
q:"Which option best describes computer addiction in the lecture?",
o:["Using a computer once for an assignment","Becoming obsessed with using a computer","Storing information on an SSD","Communicating through a network"],
a:1,
e:"The lecture describes computer addiction as becoming obsessed with using a computer."
},
{
q:"Which action is the best example of green computing?",
o:["Discarding every old computer carelessly","Leaving all computers running unnecessarily","Recycling equipment and properly disposing of replaced computers","Replacing working computers as often as possible"],
a:2,
e:"Green computing includes recycling, extending computer life, reducing electricity use, and proper disposal."
},
{
q:"Why can computers be described as reliable?",
o:["They always receive perfect input","Their electronic components are dependable and rarely break or fail","They never require electricity","They never use software"],
a:1,
e:"The lecture links reliability to the dependability of modern computer components."
},
{
q:"Which statement best explains the relationship between computer use and environmental impact?",
o:["Computer manufacturing and waste can consume natural resources and cause pollution","Computers have no environmental impact","Only software creates computer waste","Green computing requires replacing every device annually"],
a:0,
e:"Computer manufacturing and electronic waste can deplete resources and pollute the environment."
},
{
q:"A computer is used by many people to access shared services and resources. Which type of computer is specifically designed to provide services or resources to other computers?",
o:["Server","Scanner","Keyboard","Embedded system in every case"],
a:0,
e:"A server provides services or resources to other computers."
},
{
q:"Which conclusion best reflects the lecture's discussion of the advantages and disadvantages of computers?",
o:["Computers provide benefits but can also create social, health, privacy, and environmental concerns","Computers have only disadvantages","Computers have no influence on employment","Computers eliminate the need for responsible users"],
a:0,
e:"The lecture explains that computers offer benefits such as speed and communication while also creating potential risks that should be managed."
}
];

let current=0;
let answers=Array(questions.length).fill(null);
let timeLeft=15*60;
let finished=false;
let interval;

function render(){
 const q=questions[current];
 document.getElementById("question").textContent=(current+1)+". "+q.q;
 const options=document.getElementById("options");
 options.innerHTML="";
 q.o.forEach((option,i)=>{
  const b=document.createElement("button");
  b.className="option"+(answers[current]===i?" selected":"");
  b.textContent=String.fromCharCode(65+i)+". "+option;
  b.onclick=()=>{
   if(finished)return;
   answers[current]=i;
   render();
  };
  options.appendChild(b);
 });
 document.getElementById("counter").textContent=`Question ${current+1} of ${questions.length}`;
 document.getElementById("answered").textContent=`Answered: ${answers.filter(a=>a!==null).length}/${questions.length}`;
 document.getElementById("bar").style.width=((current+1)/questions.length*100)+"%";
 document.getElementById("prev").disabled=current===0;
 document.getElementById("next").disabled=current===questions.length-1;
}
function move(n){
 current=Math.max(0,Math.min(questions.length-1,current+n));
 render();
}
function updateTimer(){
 if(finished)return;
 timeLeft--;
 const m=Math.floor(timeLeft/60);
 const s=timeLeft%60;
 document.getElementById("timer").textContent=`Time: ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
 if(timeLeft<=0)submitQuiz(true);
}
function submitQuiz(auto){
 if(finished)return;
 if(!auto&&!confirm("Submit all answers now? You cannot change them after submission."))return;
 finished=true;
 clearInterval(interval);
 let score=0;
 questions.forEach((q,i)=>{if(answers[i]===q.a)score++;});
 document.getElementById("quiz").style.display="none";
 document.getElementById("stats").style.display="none";
 document.getElementById("progress").style.display="none";
 document.getElementById("result").style.display="block";
 document.getElementById("score").textContent=`Your Score: ${score}/${questions.length} (${Math.round(score/questions.length*100)}%)`;
 document.getElementById("comment").textContent=
 score>=27?"Excellent! You have a strong grasp of these topics.":
 score>=23?"Very good! Review the questions you missed.":
 score>=18?"Good effort. Revise the explanations below.":
 score>=15?"Fair attempt. Study Modules 2 and 3 again, then retry.":
 "Keep practising. Review the explanations carefully and try again.";
 if(auto)document.getElementById("comment").textContent+=" The timer ended, so your answers were submitted automatically.";
 const review=document.getElementById("review");
 review.innerHTML="";
 questions.forEach((q,i)=>{
  const div=document.createElement("div");
  div.className="review";
  const chosen=answers[i]===null?"Not answered":String.fromCharCode(65+answers[i])+". "+q.o[answers[i]];
  div.innerHTML=`<strong>${i+1}. ${q.q}</strong><p class="${answers[i]===q.a?"correct":"wrong"}">Your answer: ${chosen}</p><p class="correct">Correct answer: ${String.fromCharCode(65+q.a)}. ${q.o[q.a]}</p><p>Explanation: ${q.e}</p>`;
  review.appendChild(div);
 });
 window.scrollTo(0,0);
}
function restart(){
 current=0;
 answers=Array(questions.length).fill(null);
 timeLeft=15*60;
 finished=false;
 document.getElementById("quiz").style.display="block";
 document.getElementById("stats").style.display="flex";
 document.getElementById("progress").style.display="block";
 document.getElementById("result").style.display="none";
 render();
 document.getElementById("timer").textContent="Time: 15:00";
 interval=setInterval(updateTimer,1000);
 window.scrollTo(0,0);
}
render();
interval=setInterval(updateTimer,1000);
</script>
</body>
</html>
